
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/walletdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:walletuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:walletpass}

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

server.port=${SERVER_PORT:8080}

logging.level.com.itk.wallet=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO